];

const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const bg = c => `background-image:url('${c.still}');background-position:${c.pos}`;
const short = m => m.includes("AI 생성") ? "AI" : m.includes("합성") ? "HYBRID" : "LIVE";

function buildHome() {
  const h = BY(HERO);
  $("#hero").innerHTML =
    `<div class="bg" style="${bg(h)}"></div><div class="scrim"></div>
     <div class="mark">M I N J U N E — F I L M</div>
     <div class="cap">
       <h1>${esc(h.ko)}</h1>
       <div class="meta"><span>${esc(h.format)}</span><span style="opacity:.5">·</span><span>${h.year}</span><span style="opacity:.5">·</span><span>${short(h.method)}</span></div>
       <a class="play" href="${h.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">▶ 재생</a>
     </div>`;
  $("#hero").onclick = () => go(HERO);
  $("#rows").innerHTML = ROWS.map(r =>
    `<div><div class="rowt" style="margin-bottom:11px">${esc(r.title)}</div><div class="hsc">` +
    r.keys.map((k, i) => {
      const c = BY(k);
      const cls = r.ranked ? (i + 1 > 9 ? "card rk rk2" : "card rk") : "card";
      const rank = r.ranked ? `<span class="rank">${i + 1}</span>` : "";
      return `<div class="${cls}" data-k="${c.key}">${rank}
        <div class="poster" style="${bg(c)}">
          <div class="tband"><span>${esc(c.ko)}</span></div>
        </div></div>`;
    }).join("") + `</div></div>`
  ).join("");
  document.querySelectorAll("#rows .card").forEach(el => el.onclick = () => go(el.dataset.k));
}

     <div class="dbody">
       <h1>${esc(c.ko)}</h1>
       <div class="dmeta"><span>${c.year}</span><span style="opacity:.5">·</span><span>${esc(c.runtime)}</span><span style="opacity:.5">·</span><span>${esc(c.format)}</span></div>
       <div class="badges"><span class="bd m">${esc(c.method)}</span><span class="bd f">${esc(c.format)}</span></div>
       <a class="dplay" href="${c.url}" target="_blank" rel="noopener">▶ 재생하기</a>
       <p class="logline">${esc(c.logline)}</p>
       <div class="creds">${credits.map(([k, v]) =>
         `<div class="kv"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join("")}</div>
       <div style="display:flex;flex-direction:column;gap:11px;margin-top:6px">
         <span style="font-size:15px;font-weight:600">관련 작업</span>
         <div class="hsc" style="padding:0 0 4px">${rel.map(x =>
           `<div class="card" data-k="${x.key}"><div class="poster" style="${bg(x)}">
              <div class="tband"><span>${esc(x.ko)}</span></div></div></div>`).join("")}</div>
       </div>
     </div>`;
  document.querySelectorAll("#detail .card").forEach(el => el.onclick = () => go(el.dataset.k));
}

function render() {
  const key = decodeURIComponent(location.hash.slice(1));
  const c = key && BY(key);
  if (c) {
    buildDetail(c);
    $("#home").style.display = "none";
    $("#detail").style.display = "block";
    window.scrollTo(0, 0);
  } else {
    $("#home").style.display = "block";
    $("#detail").style.display = "none";
  }
}
function go(k) { location.hash = encodeURIComponent(k); }
function goHome() { history.length > 1 ? history.back() : (location.hash = ""); }

buildHome();
render();
window.addEventListener("hashchange", render);
</script>
</body>
</html>
