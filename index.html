  { ko:"OHIR 토너 프로덕트 필름", en:"OHIR TONER — PRODUCT FILM", type:"뷰티 프로덕트",
    method:"100% AI 생성", tools:["Nano Banana Pro","Veo","Kling"], ratio:"9:16", id:"7sTJ_lE218g",
    still:"stills/ohir.jpg", pos:"center 50%",
    line:"제품 실물 촬영 없이 물성과 성분을 정물 조명으로 세운 스킨케어 필름.",
    note:"유리 보틀과 투명 액체는 생성 모델이 가장 쉽게 무너지는 소재입니다. 반사와 굴절 방향, 라벨 타이포의 위치를 스타트 프레임에서 완전히 확정한 뒤 카메라 이동을 짧게 끊어, 형태와 로고가 흔들리지 않는 구간만 채택했습니다." },
  { ko:"GOYOA 살균가습기 브랜드 필름", en:"GOYOA STERILE HUMIDIFIER — BRAND FILM", type:"브랜드 필름",
    method:"100% AI 생성", tools:["Veo","Nano Banana Pro","Kling"], ratio:"9:16", id:"8idgTEJidCU",
    still:"stills/goyoa.jpg", pos:"center 46%",
    line:"100℃ 살균 구조를 아기의 하루 안으로 옮긴 세로형 제품 필름.",
    note:"기술 사양을 설명하지 않고 생활 장면으로 번역하는 것이 과제였습니다. 아침 햇빛이 든 거실 한 컷을 기준 프레임으로 잡고 제품·아기·공간의 색온도를 동일한 값으로 고정한 뒤, 수증기와 광량 변화만으로 시간의 흐름을 만들었습니다." },
].map((p, i) => ({ ...p, no:String(i+1).padStart(2,"0"), code:"KM-"+String(i+1).padStart(2,"0"),
  url:"https://www.youtube.com/watch?v=" + p.id }));

const PIPE = [
  { no:"01", ko:"기획 · 컨셉 보드", en:"CONCEPT", d:"레퍼런스를 해체하고 컷 단위 연출 의도를 문서로 먼저 고정합니다." },
  { no:"02", ko:"스타트 프레임 설계", en:"KEYFRAME", d:"Nano Banana Pro로 인물·조명·앵글 기준 프레임을 만들어 톤을 잠급니다." },
  { no:"03", ko:"I2V 컷 확장", en:"GENERATION", d:"Veo·Kling으로 컷을 확장하고, 형태가 유지되는 테이크만 선별합니다." },
  { no:"04", ko:"정합 · 클린업", en:"RETOUCH", d:"아티팩트를 제거하고 컷 간 색·질감·그레인을 맞춥니다. 실촬 소스가 있는 편은 키잉과 합성을 함께 진행합니다." },
  { no:"05", ko:"편집 · 컬러 · 사운드", en:"FINISHING", d:"리듬과 컬러를 잡고 납품 포맷에 맞춰 마스터를 출력합니다." },
];
const BIO = [
  ["NAME","강민준 / Kang Minjune"], ["ROLE","AI 영상 연출 · VFX 합성 · 편집"], ["BASE","Seoul, Korea"],
  ["ACTIVE","2025.10 — 2026.08 · 9편"], ["METHOD","8편 100% AI 생성 · 1편 실촬 합성"],
  ["EMAIL","idrkdalswns@gmail.com"], ["PHONE","010 2311 5166"],
];
const STACK = [
  ["Google Veo","I2V / T2V"], ["Kling","MOTION / EXTENSION"], ["Seedance 2.5","T2V · JINJU"], ["Nano Banana Pro","START FRAME"],
  ["SwitchX","CHROMA / COMP · EP.20"], ["Edit · Grade","CUT / COLOR / MASTER"],
];
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
let active = 0;

function build() {
  const track = $("#track"), tabs = $("#tabs"), rows = $("#rows");
  DATA.forEach((p, i) => {
    const s = el("div", "slide");
    s.innerHTML = '<img src="' + p.still + '" alt="' + p.ko + '" loading="' + (i ? "lazy" : "eager") +
      '" style="object-position:' + p.pos + '"><div class="scrim"></div>';
    track.appendChild(s);

    const t = el("button", "tab");
    t.type = "button";
    t.innerHTML = '<span class="in"><span class="th"><img src="' + p.still + '" alt="" loading="lazy" style="object-position:' + p.pos +
      '"></span><span class="tx"><span class="no">' + p.no + '</span><span class="ti">' + p.ko + '</span></span></span>';
    t.onclick = () => go(i);
    tabs.appendChild(t);

    const r = el("a", "row");
    r.href = p.url; r.target = "_blank"; r.rel = "noopener";
    r.innerHTML = '<span class="th"><img src="' + p.still + '" alt="" loading="lazy" style="object-position:' + p.pos +
      '"></span><span class="tx"><span class="ti">' + p.ko + '</span><span class="me">' + p.no + ' · ' + p.method + ' · ' + p.ratio +
      '</span></span><span class="goto">▶</span>';
    r.onclick = () => go(i);
    rows.appendChild(r);
  });

  const flow = $("#flow");
  PIPE.forEach(s => flow.appendChild(el("div", "step",
    '<span class="n">' + s.no + '</span><span class="k">' + s.ko + '</span><span class="e">' + s.en + '</span><span class="d">' + s.d + '</span>')));

  const bio = $("#bio");
  BIO.forEach(([k, v]) => bio.appendChild(el("div", "kv", '<span class="k">' + k + '</span><span class="v">' + v + '</span>')));

  const st = $("#stack");
  STACK.forEach(([n, r]) => st.appendChild(el("div", "st", '<span class="n">' + n + '</span><span class="r">' + r + '</span>')));
}

function render() {
  const p = DATA[active];
  $("#track").style.transform = "translateX(-" + (active * 100) + "%)";
  $("#c-kicker").textContent = "NOW SHOWING — " + p.no + " / 09";
  $("#c-title").textContent = p.ko;
  $("#c-sub").textContent = p.en;
  $("#c-line").textContent = p.line;
  $("#c-play").href = p.url;
  $("#c-tools").innerHTML = '<span class="m">' + p.method + '</span>' + p.tools.map(t => "<span>" + t + "</span>").join("");
  $("#w-code").textContent = p.code;
  $("#w-note").textContent = p.note;
  document.querySelectorAll(".tab").forEach((n, i) => n.classList.toggle("on", i === active));
  document.querySelectorAll(".row").forEach((n, i) => n.classList.toggle("on", i === active));
}

function go(i) { active = (i + DATA.length) % DATA.length; render(); }

build();
render();
$("#next").onclick = () => go(active + 1);
$("#prev").onclick = () => go(active - 1);
window.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(active + 1);
  if (e.key === "ArrowLeft") go(active - 1);
});
let sx = null;
const view = document.querySelector(".view");
view.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
view.addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 50) go(active + (dx < 0 ? 1 : -1));
  sx = null;
}, { passive: true });
</script>
</body>
</html>
