    logline:"움직임이 가장 큰 교전 구간을 전 컷 생성으로 처리한 후속편." },

  { key:"ohir", ko:"OHIR 토너", format:"AI 필름 · 프로덕트", method:"100% AI 생성", year:"2026", runtime:"9:16",
    still:"stills/ohir.jpg", pos:"center 50%", id:"7sTJ_lE218g",
    role:"연출 · 생성 · 편집", tools:["Nano Banana Pro","Veo","Kling"],
    logline:"실물 촬영 없이 물성과 성분을 정물 조명으로 세운 스킨케어 필름." },
  { key:"goyoa", ko:"GOYOA 살균가습기", format:"AI 필름 · 브랜드", method:"100% AI 생성", year:"2025", runtime:"9:16",
    still:"stills/goyoa.jpg", pos:"center 46%", id:"8idgTEJidCU",
    role:"연출 · 생성 · 편집", tools:["Veo","Nano Banana Pro","Kling"],
    logline:"100℃ 살균 구조를 아기의 하루 안으로 옮긴 세로형 제품 필름." },
];
CAT.forEach(c => { c.url = "https://youtu.be/" + c.id; });

const FMTKEY = f => f.includes("다큐") ? "doc" : f.includes("뮤직") ? "mv" : f.includes("AI") ? "ai" : "film";
const BY = k => CAT.find(c => c.key === k);
const TOP10 = ["jehovah","erase","교육814","아버지","jinju_c"];
const ROWS = [
  { title:"대표작 TOP 5", keys:TOP10, ranked:true },
  { title:"AI 프로덕션", keys:["erase","jehovah","jinju_b","jinju_c","sw7","sw20","octagon2","eternal","ohir","goyoa"] },
  { title:"극영화 & 단편", keys:["9와0","밀지마","스마트혼","bestgift"] },
  { title:"다큐멘터리 & 캠페인", keys:["아버지","교육814","crack_full","crack","fetus"] },
  { title:"뮤직비디오", keys:["reckless","슬픈","backstage"] },
];
const HERO = "jehovah";

const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const bg = c => `background-image:url('${c.still}');background-position:${c.pos}`;
const pbg = c => `background-image:url('${c.still}');background-position:${c.cpos || c.pos}`;
const short = m => m.includes("AI 생성") ? "AI" : m.includes("합성") ? "HYBRID" : "LIVE";

const HERO_MS = 4500;
function buildHero() {
  const H = TOP10.map(BY), n = H.length;
  const pad = v => String(v).padStart(2, "0");
  const slide = (c, r, clone) => `<div class="hslide" data-r="${r}" data-k="${c.key}"${clone ? ' aria-hidden="true"' : ""}>
      <div class="bg" style="${bg(c)}"></div><div class="scrim"></div>
      <div class="cap">
        <span class="kick">대표작 <b>${pad(r + 1)}</b> / ${pad(n)}</span>
        <h2>${esc(c.ko)}</h2>
        <div class="meta"><span>${esc(c.format)}</span><span style="opacity:.5">·</span><span>${c.year}</span><span style="opacity:.5">·</span><span>${short(c.method)}</span></div>
        <a class="play" href="${c.url}" target="_blank" rel="noopener"${clone ? ' tabindex="-1"' : ""}>▶ 재생</a>
      </div></div>`;
  const hero = $("#hero");
  hero.innerHTML =
    `<div class="htrack">${slide(H[n - 1], n - 1, true)}${H.map((c, r) => slide(c, r)).join("")}${slide(H[0], 0, true)}</div>
     <div class="hbars" style="--dur:${HERO_MS}ms">${H.map(() => "<i><b></b></i>").join("")}</div>
     <div class="mark">M I N J U N E — F I L M</div>`;
  const track = hero.querySelector(".htrack"), bars = hero.querySelector(".hbars");
  const slides = [...track.children], segs = [...bars.children];
  let pos = 1;
  const real = p => (p - 1 + n) % n;
  const apply = (p, anim) => {
    track.style.transition = anim ? "" : "none";
    track.style.transform = `translateX(${-p * 100}%)`;
  };
  const mark = r => {
    slides.forEach(s => s.classList.toggle("on", +s.dataset.r === r));
    segs.forEach((s, i) => { s.classList.remove("on"); s.classList.toggle("done", i < r); });
    void bars.offsetWidth;
    segs[r].classList.add("on");
  };
  const normalize = () => {
    if (pos > 0 && pos < n + 1) return;
    pos = pos <= 0 ? n : 1;
    apply(pos, false);
    void track.offsetWidth;
  };
  const step = d => { normalize(); pos += d; apply(pos, true); mark(real(pos)); };
  track.addEventListener("transitionend", e => { if (e.target === track) normalize(); });
  bars.addEventListener("animationend", e => { if (e.animationName === "hfill") step(1); });

  let sx = 0, sy = 0, dx = 0, w = 0, down = false, lock = null, moved = false;
  hero.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    down = true; lock = null; moved = false; dx = 0;
    sx = e.clientX; sy = e.clientY; w = hero.clientWidth;
    bars.classList.add("paused");
  });
  hero.addEventListener("pointermove", e => {
    if (!down) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (lock === null && Math.max(Math.abs(mx), Math.abs(my)) > 6) {
      lock = Math.abs(mx) > Math.abs(my) ? "x" : "y";
      if (lock === "x") { normalize(); hero.setPointerCapture(e.pointerId); }
    }
    if (lock !== "x") return;
    moved = true; dx = mx;
    track.style.transition = "none";
    track.style.transform = `translateX(calc(${-pos * 100}% + ${dx}px))`;
  });
  const release = () => {
    if (!down) return;
    down = false;
    bars.classList.remove("paused");
    if (lock !== "x") return;
    if (Math.abs(dx) > w * 0.16) step(dx < 0 ? 1 : -1);
    else apply(pos, true);
  };
  hero.addEventListener("pointerup", release);
  hero.addEventListener("pointercancel", release);
  hero.addEventListener("click", e => {
    if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; }
  }, true);
  hero.addEventListener("click", e => {
    if (e.target.closest(".play")) return;
    const s = e.target.closest(".hslide");
    if (s) go(s.dataset.k);
  });

  apply(pos, false);
  mark(0);
}

function buildHome() {
  buildHero();
  $("#rows").innerHTML = ROWS.map(r =>
    `<div><div class="rowt" style="margin-bottom:11px">${esc(r.title)}</div><div class="hsc">` +
    r.keys.map((k, i) => {
      const c = BY(k);
      const cls = r.ranked ? (i + 1 > 9 ? "card rk rk2" : "card rk") : "card";
      const rank = r.ranked ? `<span class="rank">${i + 1}</span>` : "";
      return `<div class="${cls}" data-k="${c.key}">${rank}
        <div class="poster" style="${pbg(c)}">
          <div class="tband"><span>${esc(c.ko)}</span></div>
        </div></div>`;
    }).join("") + `</div></div>`
  ).join("");
  document.querySelectorAll("#rows .card").forEach(el => el.onclick = () => go(el.dataset.k));
}

function buildDetail(c) {
  const rel = CAT.filter(x => x.key !== c.key && FMTKEY(x.format) === FMTKEY(c.format)).slice(0, 6);
  const credits = [
    ["역할", c.role],
    c.client ? ["클라이언트", c.client] : ["포맷", c.format],
    ["제작 방식", c.method],
    ["툴 · 장비", c.tools.join(" · ")],
  ];
  $("#detail").innerHTML =
    `<div class="dhero">
       <div class="bg" style="${bg(c)}"></div><div class="scrim"></div>
       <button class="navbtn back" onclick="goHome()">← 목록</button>
     </div>
     <div class="dbody">
       <h1>${esc(c.ko)}</h1>
       <div class="dmeta"><span>${c.year}</span><span style="opacity:.5">·</span><span>${esc(c.runtime)}</span><span style="opacity:.5">·</span><span>${esc(c.format)}</span></div>
       <div class="badges"><span class="bd m">${esc(c.method)}</span><span class="bd f">${esc(c.format)}</span></div>
       <a class="dplay" href="${c.url}" target="_blank" rel="noopener">▶ 재생하기</a>
       ${c.tagline ? `<p class="tagline">"${esc(c.tagline)}"</p>` : ""}
       <p class="logline">${esc(c.logline)}</p>
       <div class="creds">${credits.map(([k, v]) =>
         `<div class="kv"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join("")}</div>
       <div style="display:flex;flex-direction:column;gap:11px;margin-top:6px">
         <span style="font-size:15px;font-weight:600">관련 작업</span>
         <div class="hsc" style="padding:0 0 4px">${rel.map(x =>
           `<div class="card" data-k="${x.key}"><div class="poster" style="${pbg(x)}">
              <div class="tband"><span>${esc(x.ko)}</span></div></div></div>`).join("")}</div>
       </div>
     </div>`;
  document.querySelectorAll("#detail .card").forEach(el => el.onclick = () => go(el.dataset.k));
}

function render() {
  const key = decodeURIComponent(location.hash.slice(1));
  const c = key && BY(key);
  if (c) {
    buildDetail(c);
    $("#home").style.display = "none";
    $("#detail").style.display = "block";
    window.scrollTo(0, 0);
  } else {
    $("#home").style.display = "block";
    $("#detail").style.display = "none";
  }
}
function go(k) { location.hash = encodeURIComponent(k); }
function goHome() { location.hash = ""; window.scrollTo(0, 0); }

buildHome();
render();
window.addEventListener("hashchange", render);
</script>
